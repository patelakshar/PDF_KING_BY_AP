services:
  - type: web
    name: pdf-solver-mvc
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://0.0.0.0:8080
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/app/data/pdfsolver.db
      - key: Storage__UploadFolder
        value: /app/data/UploadedPdfs
      - key: Ocr__TessDataPath
        value: /app/tessdata
      - key: Ocr__Language
        value: eng
